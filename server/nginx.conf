# =============================================================================
#  Nginx 反向代理
#  分工：静态文件（含上传图片）由 Nginx 直接返回，只有 /api 与动态页才回源到 Node。
#  这样能省掉大量 Node 进程的 IO，是单机部署性价比最高的一步优化。
#
#  说明：本文件把所有 proxy 指令直接内联，不依赖 include 的额外文件 ——
#        少一个文件就少一处「配置齐全了但服务起不来」的可能。
# =============================================================================

upstream blog_api {
    server api:3000;
    keepalive 32;
}

# 前台是 Nuxt SSR，也在编排里（服务名 client）。
#
# 这里刻意**不用** host.docker.internal —— 那个名字是 Docker Desktop（Mac/Windows）
# 才提供的，Linux 上默认不解析，部署到云主机会直接 502。
# 走 compose 网络里的服务名，Linux / Mac / Windows 三种宿主行为一致。
upstream blog_client {
    server client:3001;
    keepalive 32;
}

# 限流区：给登录/注册/评论这类写接口用，防止脚本刷
limit_req_zone $binary_remote_addr zone=blog_write:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=blog_auth:10m  rate=1r/s;

server {
    listen 80;
    server_name _;

    # 配好证书后：把下面的 80 段改成 301 跳转，并另起一个 443 server 块
    # return 301 https://$host$request_uri;

    # 要与后端 UPLOAD_MAX_SIZE 保持一致。否则大图会被 Nginx 直接挡掉，
    # 而后端日志里什么都看不到，排查时很容易误判成「前端没上传」
    client_max_body_size 10m;

    # 关掉版本号：攻击者会针对特定版本找漏洞
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml application/rss+xml image/svg+xml;

    # ---------- 上传文件：Nginx 直接返回，不经过 Node ----------
    location ^~ /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        # 图片目录不该执行任何脚本，显式拒绝
        location ~* \.(php|jsp|asp|aspx|sh)$ { deny all; }
    }

    # ---------- 认证类接口：最严限流 ----------
    location ~ ^/api/v1/auth/(login|register|refresh)$ {
        limit_req zone=blog_auth burst=5 nodelay;

        proxy_pass http://blog_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 后端 main.ts 里 set('trust proxy', true) 依赖这个头拿真实 IP，
        # 少了它，点赞去重与评论限流会把所有用户当成同一个 IP
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 写操作：中等限流 ----------
    location ~ ^/api/v1/(articles/.+/comments|articles/.+/like|me/) {
        limit_req zone=blog_write burst=20 nodelay;

        proxy_pass http://blog_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://blog_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 站点地图、订阅与健康检查 ----------
    location = /health { proxy_pass http://blog_api; access_log off; }
    location = /sitemap.xml { proxy_pass http://blog_api; }
    location = /rss.xml { proxy_pass http://blog_api; }
    location = /robots.txt { proxy_pass http://blog_api; }

    # ---------- 前端 SSR ----------
    # 其余请求全部转给前台（Nuxt SSR）。这是**最后一条**兜底规则，
    # 所以上面的 /api/、/uploads/、/sitemap.xml 等必须都排在它前面。
    location / {
        proxy_pass http://blog_client;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSR 首屏要查库+渲染，比纯静态慢；给足超时，避免冷启动时被 Nginx 掐断
        proxy_read_timeout 60s;
        # 说明：没有转发 Upgrade 头。这个应用不用 WebSocket（Vite 的 HMR 只在开发期、
        # 不经过 Nginx），而带 Upgrade 头会把 Connection 置为 upgrade，
        # 反而让上面的 upstream keepalive 失效。以后真要用 WS 再加回来。
    }
}
